name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run linter (ruff)
      run: |
        ruff check . --output-format=github

    - name: Run type checker (mypy)
      run: |
        mypy src/

    - name: Run unit, golden, ui and property tests (integration and e2e run in their own job)
      run: |
        pytest tests --ignore=tests/integration --ignore=tests/e2e -v --tb=short

  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run integration and e2e tests
      run: |
        pytest tests/integration tests/e2e -v --tb=short

  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full suite with coverage
      run: |
        pytest tests --tb=short --cov=src --cov-report=xml --cov-fail-under=85

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: |
        docker build -t app-immo:ci .
