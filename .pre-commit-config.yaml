repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Runs in the project environment so it uses pyproject's mypy settings and the installed stubs
      # (pandas-stubs, numpy). The isolated mirrors-mypy env failed on a numpy stub issue under python_version 3.10.
      - id: mypy
        name: mypy (src)
        entry: mypy src/
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-quick
        name: pytest (quick)
        entry: pytest tests/unit/ -q --tb=no
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
